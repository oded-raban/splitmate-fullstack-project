# =============================================================================
# Continuous Integration
# =============================================================================
# Two workflows share this file, on two different triggers:
#
#   quality → typecheck, lint, formatting, unit + component tests   (push/PR)
#   build   → a real production build, proving the app actually compiles (push/PR)
#   e2e     → Playwright against a live Vercel preview URL   (deployment_status)
#
# `e2e` cannot run on `push`/`pull_request` directly: it needs a real, running
# instance of the app to click through, and Vercel's preview URL for a given
# commit does not exist yet at the moment GitHub fires those events — it only
# exists once Vercel reports `deployment_status: success`. Waiting for that
# event is the difference between testing the real preview and racing it.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  deployment_status:

# Cancel superseded runs: if two commits are pushed quickly, only the newer one
# needs to be verified. Saves CI minutes and gives faster feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint & tests
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches ~/.npm keyed on package-lock.json, cutting install time
          # substantially on repeat runs.
          cache: npm

      # `npm ci` installs exactly what the lockfile specifies and fails if
      # package.json and the lockfile disagree — reproducible, unlike `npm i`.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Covers the domain layer (money, splits, balances, debt simplification)
      # and React components. These are the tests that must never go red.
      - name: Unit & component tests
        run: npm test

  build:
    name: Production build
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Placeholder values are sufficient here: this job proves the code
      # *compiles*, and no network call to Supabase happens during a build.
      # Real credentials live in Vercel's environment, never in CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-build-only
          CRON_SECRET: placeholder-cron-secret-value

  e2e:
    name: End-to-end (Vercel preview)
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `deployment_status` does not carry the ref that triggered the
          # deployment as context the way `push` does — this pulls the exact
          # commit Vercel just built, not whatever `main` has moved to since.
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Points the suite at the URL Vercel just finished deploying, instead of
      # spinning up `npm run dev` — see `playwright.config.ts`'s `webServer`,
      # which is skipped whenever `PLAYWRIGHT_BASE_URL` is set.
      - name: Run E2E suite against preview deployment
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
